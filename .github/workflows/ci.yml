name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts migrations
      - run: ruff format --check src tests scripts migrations

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfs
          POSTGRES_DB: sfs_test
          # Throwaway container reachable only from this job: no password to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SFS_TEST_DATABASE_URL: postgresql+psycopg://sfs@localhost:5432/sfs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # conftest.py fails (rather than skips) database tests when CI is set.
      - run: pytest -q -rs

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build storage node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.storage_node
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
